name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + types + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sin `version:` a proposito — la version sale de `packageManager` en
      # app/package.json. Declararla tambien aca hace fallar a la action si
      # difieren. `package_json_file` es necesario porque la action mira la
      # raiz del repo por defecto, y este proyecto vive en app/ (el
      # `working-directory: app` de defaults solo aplica a los pasos `run`).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build (astro check + build)
        run: pnpm build
