services:
  dev:
    container_name: astro_dev
    build: ./docker/dev
    working_dir: /app
    volumes:
      - ./app:/app
      - /app/node_modules
      - ~/.ssh:/root/.ssh:ro
    ports:
      - "4321:4321"
    command: ["sh", "-c", "npm install && npm run dev --host"]
    networks:
      - webnet

  prod:
    container_name: astro_prod
    build:
      context: .
      dockerfile: ./docker/prod/Dockerfile
    restart: unless-stopped
    # Sin `volumes` ni `working_dir`: la imagen de prod es nginx sirviendo
    # /usr/share/nginx/html (el `dist` ya copiado en el build). Montar ./app:/app
    # no tenia efecto — solo confundia. El puerto es para probar prod en local;
    # en el server un docker-compose.override.yml lo quita y lo mueve a la red
    # del reverse proxy.
    ports:
      - "8080:80"
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
